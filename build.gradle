plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    // These types appear in Squid's public rendering/resource API.
    implementation "io.github.humbleui:skija-shared:${project.skija_version}"

    // Squid supplies Skia and its native libraries. Keep Squid as a separate mod.
    if (providers.gradleProperty('squid_jar').isPresent()) {
        implementation files(providers.gradleProperty('squid_jar').get())
        // File dependencies have no transitive metadata for Skia's public types.
        ['windows-x64', 'windows-arm64', 'linux-x64', 'linux-arm64', 'macos-x64', 'macos-arm64'].each { platform ->
            runtimeOnly "io.github.humbleui:skija-${platform}:${project.skija_version}"
        }
    } else {
        implementation "nl.devpieter:Squid:${project.squid_version}"
    }

    testImplementation platform('org.junit:junit-bom:5.14.1')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', project.minecraft_version
    inputs.property 'loader_version', project.loader_version
    inputs.property 'build_status', project.build_status
    inputs.property 'squid_version', project.squid_version
    filteringCharset 'UTF-8'

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version,
                build_status: project.build_status,
                squid_version: project.squid_version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

test {
    useJUnitPlatform()
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

loom {
    runs {
        client {
            vmArg '--enable-native-access=ALL-UNNAMED'
        }
        uiTest {
            client()
            configName = 'Toolbox UI test'
            runDir 'run/ui-test'
            vmArg '--enable-native-access=ALL-UNNAMED'
            vmArg '-Dtoolbox.testScreen=true'
            programArg '--width'
            programArg '1600'
            programArg '--height'
            programArg '900'
        }
    }
}

jar {
    from('LICENSE') {
        rename { "LICENSE_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}
